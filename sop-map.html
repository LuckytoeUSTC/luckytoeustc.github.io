const INFO={
en:()=>`<h2>How to use this map</h2>
<h3>Moving around</h3>
<p>Turn the mouse wheel to zoom. The point under the cursor stays fixed, so you can aim at any paragraph and zoom straight into it. Drag to pan. A drag never opens anything, even when it starts on a card, because only a click without movement selects. On a touch screen, drag with one finger and pinch with two. On the keyboard, + and − zoom around the center, and 0 returns to the overview.</p>
<h3>Four levels of detail</h3>
<p>Text is never shrunk to fit; instead, what the map shows changes with the zoom. From far away, each paragraph is a single node with its number, a title and a one-line gist, and the lines between paragraphs show how they relate. Zoom in and each paragraph opens into its functional blocks, each with a short summary, while the lines between paragraphs slide from the paragraph frame to the specific blocks involved. Further in, every block shows its kind and status, blocks that belong together sit on a shared plate, and labeled links inside the paragraph appear. At the closest level, each block shows its verbatim source text. Nothing is rearranged as the levels change, so you keep your bearings.</p>
<h3>The toolbar</h3>
<p>The first group of buttons sets the level of detail. ${IC('[data-level="1"]')} The network of three nodes is the overview of paragraphs and their relations. ${IC('[data-level="2"]')} The frame holding small boxes opens each paragraph into its blocks. ${IC('[data-level="3"]')} The connected boxes add the kinds, groups and links inside each paragraph. ${IC('[data-level="4"]')} The lines of text show the verbatim source. The highlighted button always tells you which level you are at, whether you got there by clicking or by zooming; if something is selected, a click on a level centers the jump on it.</p>
<p>The second group handles the view: ${IC('#btn-out')} zooms out, ${IC('#btn-in')} zooms in, and ${IC('#btn-fit')} the four corners return to the full overview. In the last group, ${IC('#btn-test')} the shield runs a self-check inside the page, covering text integrity, zoom anchoring, dragging versus clicking, closing the panel, text overflow, overlaps and redraw time, and restores your view when it finishes; ${IC('#btn-lang')} switches between English and Chinese; and ${IC('#btn-info')} opens these notes.</p>
<h3>Details</h3>
<p>Click a paragraph frame, a block, a line or its label, or one of the amber note cards, and the detail panel opens on the right. It gives the full summary, the verbatim source with its character range, the paragraph’s role and internal organization, every link in context together with the reason for it, and the notes that point there. Names in the panel select the related object when clicked, and “Locate on the map” zooms to it. While something is selected, everything unrelated fades. To close the panel, click the same object again, use the close button, press Esc, or click an empty part of the canvas.</p>
<h3>Shapes and colors</h3>
<p>Paragraph frames are colored by part of the essay: ${SW('#2f6f8f')}opening and preparation, ${SW('#2c7a64')}practical experience, ${SW('#7650a0')}theory and current work, and ${SW('#a8692a')}the future and the program fit. Inside a frame, the outline of a block tells you what kind of content it holds. A thick bar on the left marks a question, a band along the top marks study, square corners mark practical experience, a double border marks the object of study, fully rounded ends mark a gain, softly rounded corners mark a position or interest, a dashed outline marks a plan or aim, and a dotted grey outline marks template text still to be filled in. A striped plate behind several blocks means they stand side by side.</p>
<h3>Lines</h3>
<p>${SW('#2f6f8f')}Blue arrows mean that one part supports, unfolds or leads on from another. ${SW('#7d55a3')}Purple lines with dots at both ends are echoes in theme or wording; they have no direction and claim no causation. ${SW('#b04a3c')}Red lines with short bars at both ends are contrasts or distinctions. ${SW('#8a6a32')}A double line joins parallel items, ${SW('#3f8a4f')}a dotted green line leads to an example, and ${SW('#4a55b0')}a bending indigo arrow is a turn to another question. A line at full strength is supported by the wording of the text itself or has been endorsed by the author. A thinner line whose label has a dashed outline and italic text is an editorial reading, and a dashed grey line belongs to the template. ${SW('#b77822')}Dashed amber lines with open arrowheads run from a note card to the blocks it concerns.</p>
<h3>What the map claims, and what it does not</h3>
<p>The source text is shown word for word, exactly as in the source file. Block boundaries never change it, and the self-check confirms that the blocks join back into the original file. Block titles, summaries, groups and links are an editorial analysis and remain open to revision; the detail of every link says whether the text itself supports it, whether the author has endorsed it, or whether it is an editorial reading. The amber notes record questions the author is still developing, together with the author’s own words, and the map does not answer them.</p>
<h3>Language</h3>
<p>The source text stays in its original language in both versions. The Chinese version also shows the paragraph-level Chinese translation in the detail panel; the English version gives the author’s own words in translation, followed by the original wording. Switching language does not move anything on the map.</p>`,
zh:()=>`<h2>使用说明</h2>
<h3>移动与缩放</h3>
<p>滚动鼠标滚轮即可缩放。光标下的位置保持不动，所以可以对准任何一段直接放大进去。拖动画布即可平移。拖动不会打开任何内容，即使从卡片上开始拖也一样，只有不移动的单击才会选中。触屏上单指拖动、双指缩放。键盘上 + 和 − 围绕中心缩放，0 回到全景。</p>
<h3>四个层级</h3>
<p>这张图不会把文字缩小硬塞进去，而是随缩放改变显示的内容。离得远时，每段是一个节点，显示段号、标题和一句话概括，段与段之间的连线说明它们的关系。放大后，每段展开成若干功能块，每块有一句概括；与此同时，段间连线从段落外框滑到实际相关的块上。再放大，每块显示类型与状态，同组的块放在同一块底板上，段内带标签的关系线出现。最近一层，每块显示逐字原文。层级变化时不重排任何位置，方便保持方位。</p>
<h3>工具栏</h3>
<p>第一组按钮决定显示层级。${IC('[data-level="1"]')}三个相连的节点是全景，只看段落与段间关系。${IC('[data-level="2"]')}框里装着小方块，表示把每段展开成功能块。${IC('[data-level="3"]')}几个相连的方块，表示再加上类型、分组和段内关系。${IC('[data-level="4"]')}几行文字表示逐字原文。高亮的按钮始终标出当前所在层级，无论是点按钮还是滚轮缩放到达的；如果已选中对象，点层级按钮会以它为中心跳转。</p>
<p>第二组控制视图：${IC('#btn-out')}缩小，${IC('#btn-in')}放大，${IC('#btn-fit')}四个角回到全景。最后一组中，${IC('#btn-test')}盾牌在页面内运行自检，包括原文完整性、缩放锚点、拖动与点击、详情关闭、文字溢出、重叠和重绘耗时，结束后恢复原来的视图；${IC('#btn-lang')}在英文和中文之间切换；${IC('#btn-info')}打开这份说明。</p>
<h3>详情</h3>
<p>点击段落外框、功能块、连线或其标签，或者黄色批注卡，右侧会打开详情面板。面板给出完整概括、带字符位置的逐字原文、段落功能与段内组织、所有相关关系及其理由，以及指向这里的批注。面板里的名称可以点击，选中相应对象；“在图中定位”会把图缩放到它。选中时，无关内容会淡化。要关闭面板，可以再次点击同一对象、点关闭按钮、按 Esc，或者点击画布空白处。</p>
<h3>形状与颜色</h3>
<p>段落外框按文章部分着色：${SW('#2f6f8f')}开篇与准备，${SW('#2c7a64')}实践经历，${SW('#7650a0')}理论与当前工作，${SW('#a8692a')}未来与项目匹配。框内功能块的轮廓表示内容类型：左侧粗条是问题，顶部色带是学习，直角是实践经历，双线边框是研究对象，两端全圆是收获，柔和圆角是立场或兴趣，虚线框是计划或愿望，灰色点线框是尚待填写的模板。几块共用一块条纹底板，表示它们并列。</p>
<h3>连线</h3>
<p>${SW('#2f6f8f')}蓝色箭头表示支撑、展开或承接。${SW('#7d55a3')}两端带圆点的紫线表示主题或用词上的呼应，没有方向，也不表示因果。${SW('#b04a3c')}两端带短横的红线表示对照或区分。${SW('#8a6a32')}双线表示并列，${SW('#3f8a4f')}绿色点线指向例证，${SW('#4a55b0')}弯折的靛蓝箭头表示转向另一个问题。线条为完整粗细的，是原文用词直接支持或本人认可的关系；线较细、标签为虚线框斜体的，是编辑性解读；灰色虚线属于模板。${SW('#b77822')}黄色虚线配开放箭头，从批注卡指向它所关心的具体块。</p>
<h3>这张图主张什么、不主张什么</h3>
<p>原文逐字保留，与源文件完全一致。分块从不改动原文，自检会确认各块能拼回原稿。块标题、概括、分组和连线是编辑性分析，可以修改；每条关系的详情都写明它是原文直接支持、本人认可，还是编辑性解读。黄色批注记录作者仍在酝酿的问题和本人原话，图中不替作者回答。</p>
<h3>语言</h3>
<p>两个版本的原文都保持原语言。中文版会在详情中另外显示段落级中文对照；英文版给出作者原话的译文，并附上原话。切换语言不会移动图上的任何位置。</p>`};
const G={colW:600,colGap:170,rowGap:180,pad:64,head:140,plateTop:58,platePad:24,gx:520,gy:340,noteW:700};
const GRID=D.layout.grid; // 段落在网格中的 [列, 行]，由内容文件 layout.grid 指定

function el(tag,cls,text,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;if(parent)parent.append(e);return e}

/* ---------- 索引 ---------- */

D.crossEdges.forEach(e=>X.set(e.id,e));D.notes.forEach(n=>N.set(n.id,n));

const pairs=new Map();D.crossEdges.forEach(e=>{const k=pairKey(e.from,e.to);if(!pairs.has(k))pairs.set(k,[]);pairs.get(k).push(e)});

/* ---------- 构建 DOM（文字经 LOC 注册，切换语言时就地替换） ---------- */

D.paragraphs.forEach(p=>{

/* ---------- 布局（只算一次，缩放时不重排） ---------- */
function layout(){
  const fw=G.pad*2+G.colW*2+G.colGap;
  B.forEach(b=>{b.w=b.cell.cs*G.colW+(b.cell.cs-1)*G.colGap;b.el.style.width=b.w+'px';b.el.style.height='auto'});
  N.forEach(n=>{n.w=G.noteW;n.el.style.width=n.w+'px';n.el.style.height='auto'});
  {const keep=LANG;for(const lg of['zh','en']){LANG=lg;applyText();B.forEach(b=>b.nh=Math.max(b.nh||0,b.el.offsetHeight));N.forEach(n=>n.nh=Math.max(n.nh||0,n.el.offsetHeight))}LANG=keep;applyText()}
  D.paragraphs.forEach(p=>{
    const rows=Math.max(...p.blocks.map(b=>b.cell.r+b.cell.rs));
    p.blocks.forEach(b=>{b.w=b.cell.cs*G.colW+(b.cell.cs-1)*G.colGap;b.el.style.width=b.w+'px';b.el.style.height='auto'});
    const rh=new Array(rows).fill(0);
    p.blocks.filter(b=>b.cell.rs===1).forEach(b=>rh[b.cell.r]=Math.max(rh[b.cell.r],b.nh));
    p.blocks.filter(b=>b.cell.rs>1).forEach(b=>{const need=b.nh,have=rh.slice(b.cell.r,b.cell.r+b.cell.rs).reduce((a,v)=>a+v,0)+(b.cell.rs-1)*G.rowGap;if(need>have)rh[b.cell.r+b.cell.rs-1]+=need-have});
    const ry=[];let y=G.head+G.plateTop;rh.forEach((h,i)=>{ry[i]=y;y+=h+G.rowGap});
    p.fw=fw;p.fh=Math.max(y-G.rowGap+G.pad,780);p.rh=rh;p.ry=ry;
    p.blocks.forEach(b=>{b.rx=G.pad+b.cell.c*(G.colW+G.colGap);b.ry=ry[b.cell.r];b.h=rh.slice(b.cell.r,b.cell.r+b.cell.rs).reduce((a,v)=>a+v,0)+(b.cell.rs-1)*G.rowGap});
  });
  const rowH=[];
  D.paragraphs.forEach(p=>{const [c,r]=GRID[p.id];rowH[r]=Math.max(rowH[r]||0,p.fh)});
  D.notes.forEach(n=>{n.h=n.nh;n.el.style.height=n.h+'px'});
  // 批注放在 layout.notes 指定段落的下方：每行最多两张（左右对齐），单张居中
  const under=new Map();D.notes.forEach(n=>{const k=(D.layout.notes[n.id]||{}).under;if(!k)throw new Error('layout.notes 缺少 '+n.id);if(!under.has(k))under.set(k,[]);under.get(k).push(n)});
  under.forEach((list,pid)=>{const p=P.get(pid),[,r]=GRID[pid];let y=p.fh+90;const rows=[];for(let i=0;i<list.length;i+=2)rows.push(list.slice(i,i+2));
    rows.forEach(row=>{row.forEach((n,j)=>{n._rel={dx:row.length===1?(fw-n.w)/2:(j===0?0:fw-n.w),dy:y}});y+=Math.max(...row.map(n=>n.h))+80});
    rowH[r]=Math.max(rowH[r],y-80);list.forEach(n=>n._pid=pid)});
  const nCols=Math.max(...Object.values(GRID).map(g=>g[0]))+1;
  const colX=[...Array(nCols).keys()].map(c=>c*(fw+G.gx)),rowY=[0];for(let r=1;r<rowH.length;r++)rowY[r]=rowY[r-1]+rowH[r-1]+G.gy;
  D.paragraphs.forEach(p=>{
    const [c,r]=GRID[p.id];p.gc=c;p.gr=r;p.x=colX[c];p.y=rowY[r];
    Object.assign(p.el.style,{left:p.x+'px',top:p.y+'px',width:p.fw+'px',height:p.fh+'px'});
    p.blocks.forEach(b=>{b.x=p.x+b.rx;b.y=p.y+b.ry;Object.assign(b.el.style,{left:b.x+'px',top:b.y+'px',height:b.h+'px'})});
    p.groups.forEach(g=>{const bs=g.blocks.map(id=>B.get(id));const x0=Math.min(...bs.map(b=>b.rx))-G.platePad,y0=Math.min(...bs.map(b=>b.ry))-G.plateTop,x1=Math.max(...bs.map(b=>b.rx+b.w))+G.platePad,y1=Math.max(...bs.map(b=>b.ry+b.h))+G.platePad;
      Object.assign(g.el.style,{left:x0+'px',top:y0+'px',width:(x1-x0)+'px',height:(y1-y0)+'px'})});
  });
  D.notes.forEach(n=>{const p=P.get(n._pid);n.x=p.x+n._rel.dx;n.y=p.y+n._rel.dy;n.el.style.left=n.x+'px';n.el.style.top=n.y+'px'});
  const lastR=rowH.length-1,maxX=colX[nCols-1]+fw,maxY=rowY[lastR]+rowH[lastR]+260;
  WORLD.w=maxX;WORLD.h=maxY;WORLD.rowY=rowY;WORLD.rowH=rowH;WORLD.colX=colX;WORLD.fw=fw;
  SVG.setAttribute('width',maxX);SVG.setAttribute('height',maxY);
}
const WORLD={};

/* ---------- 端口与曲线 ---------- */
const NORM={top:[0,-1],bottom:[0,1],left:[-1,0],right:[1,0]};
function sides(pa,pb){
  const dc=pb.gc-pa.gc,dr=pb.gr-pa.gr;
  if(dr===0)return Math.abs(dc)===1?[dc>0?'right':'left',dc>0?'left':'right',0]:(pa.gr===0?['top','top',1]:['bottom','bottom',1]);
  if(dc===0)return Math.abs(dr)===1?[dr>0?'bottom':'top',dr>0?'top':'bottom',0]:['left','left',1];
  return [dr>0?'bottom':'top',dr>0?'top':'bottom',0];
}
function framePort(p,side,other){ // 段落级端口：边的中点，按对方方向偏移，避免全部挤在一点
  const off=other?clamp(side==='top'||side==='bottom'?(other.gc-p.gc):(other.gr-p.gr),-2,2)*0.2:0;
  if(side==='top'||side==='bottom')return{x:p.x+p.fw*(0.5+off),y:side==='top'?p.y:p.y+p.fh};
  return{x:side==='left'?p.x:p.x+p.fw,y:p.y+p.fh*(0.5+off*0.8)};
}
function segHits(a,b,r,m){ // 轴对齐线段与矩形相交
  const x0=Math.min(a.x,b.x),x1=Math.max(a.x,b.x),y0=Math.min(a.y,b.y),y1=Math.max(a.y,b.y);
  return x1>r.x+m&&x0<r.x+r.w-m&&y1>r.y+m&&y0<r.y+r.h-m;
