<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<style>
:root{color-scheme:light;--ink:#22323d;--muted:#5f707b;--paper:#f7f6f1;--canvas:#eef1f2;--rule:#d6dde1;--accent:#2d4c63}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.55 system-ui,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:#fff;border:1px solid #c9d3da;border-radius:7px;padding:5px 11px;cursor:pointer}
button:hover{background:#edf3f7}
button:focus-visible{outline:3px solid #4f86ad;outline-offset:2px}
button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
header.top{display:flex;align-items:center;gap:12px;padding:10px 14px 8px 18px}
header.top h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;align-items:center;margin-left:auto}
.tg{display:flex;gap:2px;padding:3px;background:#fff;border:1px solid #d3dce2;border-radius:12px}
.ib{width:36px;height:36px;padding:0;display:grid;place-items:center;border:0;background:transparent;border-radius:9px;color:#3a4d5a}
.ib:hover{background:#edf3f7}
.ib[aria-pressed=true]{background:var(--accent);color:#fff}
.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:#e7eef3}
#info{position:fixed;top:56px;right:14px;width:min(560px,calc(100vw - 28px));max-height:calc(100vh - 80px);overflow:auto;background:#fff;border:1px solid var(--rule);border-radius:14px;box-shadow:0 18px 44px #1c2e3a30;padding:6px 26px 22px;z-index:20;display:none;line-height:1.7;font-size:14.5px}
#info.open{display:block}
#info h2{font-size:18px;margin:16px 0 4px}
#info h3{font-size:14.5px;margin:18px 0 2px;color:#2d4c63}
#info p{margin:6px 0}
#info .x{position:sticky;top:6px;float:right;margin-right:-14px}
.ii svg{width:18px;height:18px;vertical-align:-4px;fill:none;stroke:#2d4c63;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin:0 2px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);vertical-align:-1px;margin:0 3px 0 1px}
.stage{position:relative;flex:1;min-height:420px;margin:0 12px 12px;border:1px solid #cbd6dc;border-radius:12px;overflow:hidden;background:var(--canvas)}
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#viewport.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#world.moving{will-change:transform}
#world.no-blocks .block,#world.no-blocks .plate,#world.no-blocks .fhead,#world.no-blocks .n-body,#world.no-blocks #g-cross,#world.no-blocks .elabel.cross{visibility:hidden}
#world.no-over .frame .over,#world.no-over .note .n-over,#world.no-over #g-pair,#world.no-over .elabel.pair{visibility:hidden}
#world.no-src .b-src .src,#world.no-src .b-src .cap,#world.no-src .note .nr{visibility:hidden}
#world.no-sum .b-sum,#world.no-sum .b-src:before,#world.no-sum .note .nt{visibility:hidden}
#world.no-st .b-meta,#world.no-st #g-inner,#world.no-st .elabel.inner,#world.no-st .note .nw{visibility:hidden}
.cull{visibility:hidden!important}
#world>div,#world>svg{position:absolute;left:0;top:0}
#links{overflow:visible;pointer-events:none}
#links .hit{pointer-events:stroke;cursor:pointer;stroke:transparent;fill:none}
/* ---------- 段落外框 ---------- */
.frame{position:absolute;border:4px solid var(--c);border-radius:34px;background:var(--bg);cursor:pointer}
.frame .fhead{position:absolute;left:40px;right:40px;top:26px;height:96px;opacity:var(--tb);pointer-events:none;display:flex;align-items:baseline;gap:18px;white-space:nowrap}
.frame .fhead .pn{font-size:46px;font-weight:750;color:var(--c)}
.frame .fhead .pt{font-size:40px;font-weight:650}
.frame .fhead .pr{font-size:24px;color:var(--muted);border:2px solid color-mix(in srgb,var(--c) 40%,white);border-radius:30px;padding:0 16px}
.frame .over{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 60px;opacity:var(--tov);pointer-events:none;gap:18px}
.frame .over .pn{font-size:170px;line-height:1;font-weight:800;color:var(--c)}
.frame .over .pt{font-size:102px;line-height:1.2;font-weight:700}
.frame .over .pg{font-size:80px;line-height:1.35;color:#3e505c;max-width:1340px}
.plate{position:absolute;border-radius:26px;background:color-mix(in srgb,var(--c) 9%,white);border:2px solid color-mix(in srgb,var(--c) 22%,white);pointer-events:none;opacity:var(--tb)}
.plate.parallel{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 10%,white) 0 18px,color-mix(in srgb,var(--c) 5%,white) 18px 36px);border-style:solid}
.plate.lane{border-style:dashed;background:color-mix(in srgb,var(--c) 6%,white)}
.plate .pl-title{position:absolute;left:26px;top:12px;font-size:22px;font-weight:650;color:color-mix(in srgb,var(--c) 80%,black);opacity:var(--tpl);white-space:nowrap}
.plate.parallel .pl-title:before{content:"∥ ";font-weight:800}
/* ---------- 功能块 ---------- */
.block{position:absolute;background:#fff;border:3px solid color-mix(in srgb,var(--c) 55%,white);border-radius:10px;padding:22px 28px 24px;opacity:var(--tb);cursor:pointer;display:flex;flex-direction:column;gap:10px}
.block.k-question{border-left:14px solid var(--c);border-radius:8px}
.block.k-learn{border-top:12px solid color-mix(in srgb,var(--c) 70%,white);border-radius:8px}
.block.k-experience{border-radius:2px}
.block.k-object{border:7px double color-mix(in srgb,var(--c) 70%,white);border-radius:2px}
.block.k-gain{border-radius:64px;padding-left:46px;padding-right:46px}
.block.k-interest{border-radius:30px}
.block.k-plan{border:3px dashed var(--c);border-radius:8px}
.block.k-template{border:4px dotted #8b949b;background:#fbfbfa}
.b-meta{display:flex;flex-wrap:wrap;gap:8px;opacity:var(--tst);min-height:26px}
.b-meta span{font-size:17px;line-height:24px;padding:0 10px;border-radius:12px;background:#eef2f4;color:#465863}
.b-meta .kind{background:color-mix(in srgb,var(--c) 14%,white);color:color-mix(in srgb,var(--c) 80%,black);font-weight:600}
.b-title{margin:0;font-size:30px;line-height:1.25;font-weight:680;color:color-mix(in srgb,var(--c) 85%,black)}
.b-sum{margin:0;font-size:24px;line-height:1.5;opacity:var(--ts)}
.b-src{position:relative;margin-top:4px;padding-top:10px;border-top:2px solid #e5eaed}
.b-src .cap{font-size:12px;color:#7a8a94;opacity:var(--tsrc);letter-spacing:.02em}
.b-src .src{margin:2px 0 0;font:13px/1.55 Georgia,"Times New Roman",serif;color:#1f2f3a;opacity:var(--tsrc);overflow-wrap:break-word}
.b-src:before{content:"";position:absolute;left:0;right:0;top:14px;bottom:4px;opacity:calc(var(--ts) * (1 - var(--tsrc)) * .55);background:repeating-linear-gradient(180deg,#dfe5e9 0 9px,transparent 9px 20px);border-radius:3px;pointer-events:none}
/* ---------- 酝酿批注 ---------- */
.note{position:absolute;min-height:540px;background:#fff6e6;border:3px dashed #b77822;border-radius:10px 70px 10px 10px;padding:28px 34px;cursor:pointer;display:flex;flex-direction:column;gap:12px}
.note:after{content:"";position:absolute;right:-3px;top:-3px;width:70px;height:70px;background:linear-gradient(225deg,var(--canvas) 0 49%,#e8c792 50% 100%);border-radius:0 70px 0 0}
.note .n-over{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:40px 50px;gap:12px;opacity:var(--tov);pointer-events:none}
.note .n-over .tag{font-size:52px;color:#9a6420;font-weight:700}
.note .n-over .tt{font-size:74px;line-height:1.2;color:#6e4612;font-weight:750}
.note .n-body{display:flex;flex-direction:column;gap:12px;opacity:var(--tb)}
.note .tag{font-size:16px;color:#9a6420;font-weight:650;letter-spacing:.04em}
.note .tt{font-size:30px;line-height:1.3;font-weight:700;color:#6e4612;margin:0}
.note .nt{font-size:22px;line-height:1.55;color:#5a4426;margin:0;opacity:var(--ts)}
.note .nw{font-size:19px;line-height:1.55;color:#7a5a2c;margin:0;opacity:var(--tst);border-left:4px solid #dcb26f;padding-left:12px}
.note .nr{font-size:16px;line-height:1.5;color:#7a6a55;margin:0;opacity:var(--tsrc)}
/* ---------- 关系标签 ---------- */
.elabel{position:absolute;width:max-content;transform:translate(-50%,-50%);background:#fbfaf6;border:2px solid var(--c);color:color-mix(in srgb,var(--c) 85%,black);border-radius:10px;padding:2px 10px;text-align:center;cursor:pointer;white-space:normal}
.elabel.cross{font-size:24px;line-height:1.3;max-width:380px}
.elabel.pair{font-size:72px;line-height:1.22;padding:6px 20px;border-width:4px;border-radius:20px;max-width:470px}
.elabel.inner{font-size:17px;line-height:1.3;max-width:150px;border-width:1.5px;padding:2px 6px}
.elabel.inner.wide{max-width:430px}
.elabel.editorial{border-style:dashed;font-style:italic}
.elabel.template{border-style:dotted;color:#69737a}
.elabel .ty{font-weight:700;font-style:normal;margin-right:4px}
/* ---------- 选中与淡化 ---------- */
.frame.sel{box-shadow:0 0 0 14px color-mix(in srgb,var(--c) 30%,transparent)}
.block.sel,.note.sel{box-shadow:0 0 0 8px color-mix(in srgb,var(--c,#b77822) 45%,transparent)}
.note.sel{box-shadow:0 0 0 8px #e2a54a88}
.frame.dim{opacity:.4}
.block.dim{opacity:calc(var(--tb) * .28)}
.note.dim{opacity:.3}
.elabel.dim{opacity:.12!important}
.elabel.sel{box-shadow:0 0 0 5px #2d4c6355}
/* ---------- 详情 ---------- */
#panel{position:absolute;top:10px;right:10px;bottom:10px;width:min(420px,calc(100% - 20px));background:#fff;border:1px solid var(--rule);border-top:5px solid var(--pc,#2d4c63);border-radius:12px;box-shadow:0 12px 34px #1c2e3a26;display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .18s ease;z-index:5}
#panel.open{transform:none}
#panel .ph{display:flex;align-items:flex-start;gap:8px;padding:14px 16px 8px;border-bottom:1px solid #edf0f2}
#panel .ph .ttl{flex:1}
#panel .ph h2{font-size:17px;margin:0 0 4px;line-height:1.35}
#panel .ph .ids{color:var(--muted);font-size:12px}
#panel .pb{overflow:auto;padding:6px 16px 18px}
#panel h3{font-size:13px;margin:16px 0 4px;color:#36566e;letter-spacing:.02em}
#panel p{margin:4px 0;overflow-wrap:anywhere}
#panel .source{border-left:3px solid #8d70a6;padding:2px 0 2px 10px;font-family:Georgia,"Times New Roman",serif;font-size:14.5px;line-height:1.6;white-space:pre-wrap}
#panel .zh{border-left:3px solid #c9d3da;padding-left:10px;color:#3d4d57}
#panel .badge{display:inline-block;border-radius:5px;padding:1px 7px;margin:0 4px 4px 0;background:#edf2f5;font-size:12.5px}
#panel .badge.warn{background:#fff1dc;color:#8a5a14}
#panel .badge.ok{background:#e6f3ec;color:#1f6a45}
#panel .badge.ed{background:#f1ecf7;color:#5d3f80}
#panel ul{margin:4px 0;padding-left:18px}
#panel li{margin:3px 0}
#panel .link{border:0;background:none;padding:0;color:#245d86;text-decoration:underline;text-underline-offset:2px;cursor:pointer;text-align:left}
#panel .boundary{background:#fff7ea;border:1px solid #f0d9b0;border-radius:8px;padding:6px 10px}
#panel .review{background:#f3f6f8;border-radius:8px;padding:6px 10px;color:#3e5260}
#panel .user{background:#fff3df;border-radius:8px;padding:6px 10px}
#panel .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* ---------- 自检 ---------- */
#testbox{position:absolute;left:10px;top:10px;max-width:min(560px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;background:#fff;border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 30px #1c2e3a26;padding:10px 14px;z-index:6;font-size:13px;display:none}
#testbox.show{display:block}
#testbox .t{display:flex;gap:8px;margin:3px 0}
#testbox .t b{min-width:34px}
#testbox .pass b{color:#1f7a4a}
#testbox .fail b{color:#b3261e}
#testbox .d{color:var(--muted)}
.help{padding:0 18px 10px;color:var(--muted);font-size:12.5px}
@media (max-width:900px){
  header.top h1{font-size:14px}
  .ib{width:32px;height:32px}
  .tools{gap:4px}
  .stage{margin:0 6px 6px}
  #panel{top:auto;left:6px;right:6px;width:auto;height:52%;bottom:6px;transform:translateY(calc(100% + 20px))}
}
@media (max-width:620px){header.top h1{display:none}.tools{margin-left:0;flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
</style>
</head>

, "sourceStart": 0, "sourceEnd": 97, "sourceText": "I want to understand how the collective activity of neurons gives rise to learning and cognition.", "cell": {"r": 0, "c": 0, "cs": 2, "rs": 1}, "title_en": "Central question: collective activity and cognition", "status_en": "Research vision", "summary_en": "How the collective activity of neurons gives rise to learning and cognition."}, {"id": "p1-physics", "title": "物理视角", "kind": "interest", "status": "已有训练与兴趣", "summary": "理论物理教我在差异很大的系统中寻找共享结构；现在想把这种思路带进神经科学。", "sourceStart": 98, "sourceEnd": 235, "sourceText": "Theoretical physics taught me to look for structures shared by very different systems. I now want to bring that approach to neuroscience.", "cell": {"r": 1, "c": 0, "cs": 1, "rs": 1}, "title_en": "A physics perspective", "status_en": "Existing training and interest", "summary_en": "Theoretical physics taught a habit of looking for structures shared by very different systems; the aim now is to bring that habit to neuroscience."}, {"id": "p1-theory", "title": "理论与丰富现象", "kind": "interest", "status": "理念已写，经验联系待酝酿", "summary": "理论提供解释观察的框架，而神经系统的丰富性不断提出现有模型尚未回答的问题。", "sourceStart": 236, "sourceEnd": 390, "sourceText": "Theory gives us a framework for explaining what we observe, but the richness of neural systems keeps raising questions that our models have yet to answer.", "cell": {"r": 1, "c": 1, "cs": 1, "rs": 1}, "title_en": "Theory and the richness of phenomena", "status_en": "View stated; link to experience still developing", "summary_en": "Theory offers a framework for explaining what we observe, while the richness of neural systems keeps raising questions that current models cannot yet answer."}, {"id": "p1-phd", "title": "PhD 目标", "kind": "plan", "status": "申请目标", "summary": "想在理论与计算神经科学 PhD 中研究这些问题。", "sourceStart": 391, "sourceEnd": 488, "sourceText": "I want to take on those questions in a PhD program in theoretical and computational neuroscience.", "cell": {"r": 2, "c": 0, "cs": 2, "rs": 1}, "title_en": "The PhD goal", "status_en": "Application goal", "summary_en": "To take on these questions in a PhD in theoretical and computational neuroscience."}], "title_en": "Theory and neural systems", "role_en": "Opening position", "gist_en": "The central question, a physicist's approach, and the PhD goal", "structure_en": "The paragraph opens with the central question; the physics perspective and the view of theory say how to approach it; the last sentence turns “those questions” into the PhD goal. The essay is organized by theme, not by the order in which the author's ideas formed.", "boundary_en": "The essay is organized by theme and does not reconstruct the order in which the author's understanding developed. The undergraduate thesis is only one part of a broader scientific interest.", "groups": [{"id": "p1-g1", "title": "怎样接近：方法与理论观", "blocks": ["p1-physics", "p1-theory"], "form": "plate", "title_en": "How to approach it: method and view of theory"}], "internalEdges": [{"id": "p1-i1", "from": "p1-goal", "to": "p1-physics", "type": "method", "status": "text", "label": "以物理思路接近总问题", "reason": "“I now want to bring that approach to neuroscience” 把物理思路指向开篇的问题。", "label_en": "Approaching the question with a physicist's habit", "reason_en": "“I now want to bring that approach to neuroscience” points the physics approach at the opening question."}, {"id": "p1-i2", "from": "p1-physics", "to": "p1-theory", "type": "elaboration", "status": "editorial", "label": "从方法背景到理论立场", "reason": "两句都谈理论的作用：前者是方法训练，后者是对理论与现象关系的看法。", "label_en": "From method to a view of theory", "reason_en": "Both sentences concern what theory does: the first is training in method, the second a view of how theory relates to phenomena."}, {"id": "p1-i3", "from": "p1-theory", "to": "p1-phd", "type": "purpose", "status": "text", "label": "“those questions”成为 PhD 目标", "reason": "末句 “take on those questions” 直接指回上一句模型尚未回答的问题。", "label_en": "“Those questions” become the PhD goal", "reason_en": "The last sentence, “take on those questions”, refers back to the questions that models have yet to answer."}]}, {"id": "p2", "title": "数学工具与物理思想", "role": "学术准备", "category": "position", "gist": "数学工具与系综思想并列，引出连接–活动–功能问题", "structure": "数学工具与统计物理视角并列；系综视角给出一个具体的神经问题；replica 是另一条“技术迁移”的例子，不是前一问题的答案。", "boundary": "Wen 组提供的 replica 材料与 Hu–Sompolinsky 自由概率论文是两份材料；前者的来源已在项目中核对，不因网络检索不到而删去这一联系。", "number": 2, "sourceText": "Several courses from my physics training have been especially useful in computational neuroscience. Linear algebra, probability, and statistics gave me tools to build models and calculate their predictions. At UC Berkeley, my course in statistical and thermal physics showed me how ensembles connect microscopic states to macroscopic behavior. This view gives me a starting point for a more specific question in computational neuroscience: how does the way neurons are connected shape their collective activity, and how does that activity support representation and behavior? The replica trick is one example of a mathematical technique that carries over from physics to neuroscience. I presented it in a quantum gravity reading group at Berkeley and later saw it used to calculate the covariance spectrum of a structured recurrent network.", "sourceChinese": "物理训练中，有几门课对我学习计算神经科学尤其有帮助。线性代数和概率论与数理统计为我建模和计算模型的预测提供了工具。在伯克利，我通过统计与热物理课学到，系综怎样把微观状态和宏观行为联系起来。这一视角为我理解计算神经科学中一个更具体的问题提供了起点：神经元的连接方式怎样塑造集体活动，这些活动又怎样支持表征和行为？Replica trick 是物理方法能够用于神经科学的一个例子。我在伯克利的量子引力读书组介绍过这一数学技巧，后来看到它也可用来求结构化递归网络的活动协方差谱。", "blocks": [{"id": "p2-math", "title": "数学工具", "kind": "learn", "status": "已学", "summary": "物理训练中的线性代数、概率与统计，为建立模型、计算模型预测提供工具。", "sourceStart": 0, "sourceEnd": 206, "sourceText": "Several courses from my physics training have been especially useful in computational neuroscience. Linear algebra, probability, and statistics gave me tools to build models and calculate their predictions.", "cell": {"r": 0, "c": 0, "cs": 1, "rs": 1}, "title_en": "Mathematical tools", "status_en": "Learned", "summary_en": "Linear algebra, probability and statistics from physics training give tools for building models and computing their predictions."}, {"id": "p2-ensemble", "title": "系综思想", "kind": "learn", "status": "已学", "summary": "伯克利的统计与热物理课：系综怎样把微观状态与宏观行为联系起来。", "sourceStart": 207, "sourceEnd": 343, "sourceText": "At UC Berkeley, my course in statistical and thermal physics showed me how ensembles connect microscopic states to macroscopic behavior.", "cell": {"r": 0, "c": 1, "cs": 1, "rs": 1}, "title_en": "Ensemble thinking", "status_en": "Learned", "summary_en": "A Berkeley course in statistical and thermal physics: how ensembles connect microscopic states to macroscopic behavior."}, {"id": "p2-question", "title": "连接、活动与功能", "kind": "question", "status": "理论切口", "summary": "由这一视角出发的具体问题：连接方式怎样塑造集体活动，活动又怎样支持表征与行为？", "sourceStart": 344, "sourceEnd": 575, "sourceText": "This view gives me a starting point for a more specific question in computational neuroscience: how does the way neurons are connected shape their collective activity, and how does that activity support representation and behavior?", "cell": {"r": 1, "c": 1, "cs": 1, "rs": 1}, "title_en": "Connections, activity and function", "status_en": "Theoretical entry point", "summary_en": "A specific question from this view: how does connectivity shape collective activity, and how does that activity support representation and behavior?"}, {"id": "p2-replica", "title": "技术迁移的例子：replica", "kind": "experience", "status": "报告及阅读经历", "summary": "在伯克利量子引力读书组报告过 replica trick，后来看到它被用于计算结构化递归网络的协方差谱。", "sourceStart": 576, "sourceEnd": 840, "sourceText": "The replica trick is one example of a mathematical technique that carries over from physics to neuroscience. I presented it in a quantum gravity reading group at Berkeley and later saw it used to calculate the covariance spectrum of a structured recurrent network.", "cell": {"r": 1, "c": 0, "cs": 1, "rs": 1}, "title_en": "A transferred technique: the replica trick", "status_en": "Presentation and reading", "summary_en": "Presented the replica trick at a quantum gravity reading group at Berkeley, then saw it used to compute the covariance spectrum of a structured recurrent network."}], "title_en": "Mathematical tools and physical ideas", "role_en": "Academic preparation", "gist_en": "Tools and ensemble thinking lead to a question on connectivity", "structure_en": "Mathematical tools and the statistical-physics view stand side by side; the ensemble view yields a specific neural question; the replica trick is a separate example of a technique carrying over, not an answer to that question.", "boundary_en": "The replica material provided by Wen's group and the Hu–Sompolinsky free-probability paper are two different sources. The source of the former has been checked within the project, and the link is kept even if a web search does not find it.", "groups": [{"id": "p2-g1", "title": "两类准备 · 并列", "blocks": ["p2-math", "p2-ensemble"], "form": "parallel", "title_en": "Two kinds of preparation, side by side"}], "internalEdges": [{"id": "p2-i1", "from": "p2-math", "to": "p2-ensemble", "type": "parallel", "status": "editorial", "label": "工具与物理思想并列", "reason": "两句分别介绍课程工具与统计物理视角，彼此没有推导关系。", "label_en": "Tools and ideas, side by side", "reason_en": "The two sentences introduce coursework tools and the statistical-physics view; neither is derived from the other."}, {"id": "p2-i2", "from": "p2-ensemble", "to": "p2-question", "type": "elaboration", "status": "text", "label": "“This view”给出具体问题的起点", "reason": "原文 “This view gives me a starting point for a more specific question”。", "label_en": "“This view” gives the starting point", "reason_en": "The text says: “This view gives me a starting point for a more specific question”."}, {"id": "p2-i3", "from": "p2-math", "to": "p2-replica", "type": "example", "status": "text", "label": "数学技巧跨学科迁移的例子", "reason": "原文 “one example of a mathematical technique that carries over from physics to neuroscience”。", "label_en": "An example of a technique carrying over", "reason_en": "The text says: “one example of a mathematical technique that carries over from physics to neuroscience”."}]}, {"id": "p3", "title": "Berkeley 的实践与启发", "role": "科研训练与兴趣拓展", "category": "experience", "gist": "计算实践带来复现与沟通能力；seminar 另开生物物理兴趣", "structure": "两条并列支线：计算实践带来复现与沟通两种能力；seminar 启发了对生命系统理论的兴趣。听 seminar 不是数值计算的结果。", "boundary": "两种收获并列：代码复现进入理论，seminar 带来生命现象启发。不能画成英语沟通导致参加 seminar，或计算导致兴趣转向。", "number": 3, "sourceText": "At Berkeley, I worked with Malcolm Lazarow in Professor Raúl Briceño’s group. I started with a harmonic oscillator and wrote Monte Carlo code to estimate its energy gap from a correlation function. That calculation helped me see how physical quantities can be extracted from numerical simulations. From there, I began to understand the basic idea behind the Lüscher formalism: how two-particle energy levels in a finite box relate to scattering phase shifts. By reproducing calculations with existing code, I learned a way to quickly understand abstract theories. I also learned to explain the objectives of my calculations and their physical motivation in English. The seminars I attended at Berkeley changed what I wanted to study. In a seminar on nonequilibrium statistical physics, I saw how physicists ask similar questions about collective motion in groups of cells and in flocks of birds. A seminar on protein structure prediction made me wonder why alternative conformations, including metastable states, are still hard to predict and how evolutionary changes affect protein function. I began to see how much room there was for theory in the study of living systems. That possibility drew me to biophysics.", "sourceChinese": "在伯克利，我在 Raúl Briceño 教授的课题组跟随 Malcolm Lazarow 做研究。我从简谐振子入手，编写 Monte Carlo 代码，从关联函数中估计能隙。这个计算让我看到怎样从数值模拟中提取物理量。由此，我开始理解 Lüscher formalism 的基本思想：有限盒子中的两粒子能级怎样与散射相移联系起来。通过利用现有代码复现计算，我学到了一种快速理解抽象理论的方法。我也学会了用英语说明计算的目标及其物理动机。我在伯克利参加的一些学术研讨改变了我想研究的对象。一次关于非平衡统计物理的研讨让我看到，物理学家怎样对细胞群和鸟群的集体运动提出相似的问题。蛋白质结构预测的研讨则让我想知道，为什么包括亚稳态在内的其他构象仍然难以预测，以及演化中的变化怎样影响蛋白质的功能。我开始看到，生命现象为理论留下了多大的发问空间，也因此对生物物理产生了兴趣。", "blocks": [{"id": "p3-computation", "title": "计算实践：从 MC 到 Lüscher", "kind": "experience", "status": "计算及学习经历", "summary": "在 Briceño 组跟随 Malcolm Lazarow，用 Monte Carlo 从关联函数估计谐振子能隙，看到怎样从模拟中提取物理量，并开始理解 Lüscher 方法的基本思想。", "sourceStart": 0, "sourceEnd": 458, "sourceText": "At Berkeley, I worked with Malcolm Lazarow in Professor Raúl Briceño’s group. I started with a harmonic oscillator and wrote Monte Carlo code to estimate its energy gap from a correlation function. That calculation helped me see how physical quantities can be extracted from numerical simulations. From there, I began to understand the basic idea behind the Lüscher formalism: how two-particle energy levels in a finite box relate to scattering phase shifts.", "cell": {"r": 0, "c": 0, "cs": 1, "rs": 1}, "title_en": "Computation: from Monte Carlo to Lüscher", "status_en": "Computation and study", "summary_en": "With Malcolm Lazarow in Briceño's group: Monte Carlo estimates of an oscillator's energy gap from a correlation function, seeing how physical quantities come out of simulations, and beginning to grasp the idea behind the Lüscher formalism."}, {"id": "p3-skills", "title": "复现与科研沟通", "kind": "gain", "status": "本人认可的能力收获", "summary": "借现有代码复现计算，学到快速理解抽象理论的方法；也学会用英语说明计算目标与物理动机。", "sourceStart": 459, "sourceEnd": 665, "sourceText": "By reproducing calculations with existing code, I learned a way to quickly understand abstract theories. I also learned to explain the objectives of my calculations and their physical motivation in English.", "cell": {"r": 1, "c": 0, "cs": 1, "rs": 1}, "title_en": "Reproducing calculations, explaining research", "status_en": "Skills the author recognizes", "summary_en": "Reproducing calculations with existing code as a fast way into abstract theory; explaining the goals and physical motivation of calculations in English."}, {"id": "p3-seminars", "title": "seminar：生命现象的理论空间", "kind": "experience", "status": "兴趣形成经历", "summary": "非平衡统计物理与蛋白质结构预测的 seminar，让我看到生命系统中理论的发问空间，并被生物物理吸引。", "sourceStart": 666, "sourceEnd": 1214, "sourceText": "The seminars I attended at Berkeley changed what I wanted to study. In a seminar on nonequilibrium statistical physics, I saw how physicists ask similar questions about collective motion in groups of cells and in flocks of birds. A seminar on protein structure prediction made me wonder why alternative conformations, including metastable states, are still hard to predict and how evolutionary changes affect protein function. I began to see how much room there was for theory in the study of living systems. That possibility drew me to biophysics.", "cell": {"r": 0, "c": 1, "cs": 1, "rs": 2}, "title_en": "Seminars: room for theory in living systems", "status_en": "How an interest formed", "summary_en": "Seminars on nonequilibrium statistical physics and protein structure prediction showed how much room there is for theory in living systems, and drew the author to biophysics."}], "title_en": "Practice and inspiration at Berkeley", "role_en": "Research training and widening interests", "gist_en": "Computation builds skills; seminars open up biophysics", "structure_en": "Two parallel strands: computational practice yields two skills, reproducing calculations and explaining them; the seminars spark an interest in theory for living systems. Attending the seminars is not a result of the numerical work.", "boundary_en": "There are two parallel gains: reproducing code as a way into theory, and seminars as a source of questions about living systems. English communication must not be drawn as leading to the seminars, nor the computation as causing the shift of interest.", "groups": [{"id": "p3-g1", "title": "支线一 · 计算实践与收获", "blocks": ["p3-computation", "p3-skills"], "form": "lane", "title_en": "Strand one: computation and its gains"}, {"id": "p3-g2", "title": "支线二 · seminar 启发", "blocks": ["p3-seminars"], "form": "lane", "title_en": "Strand two: seminars"}], "internalEdges": [{"id": "p3-i1", "from": "p3-computation", "to": "p3-skills", "type": "result", "status": "text", "label": "复现计算带来的两种能力", "reason": "原文 “By reproducing calculations with existing code, I learned…”，收获直接来自上述计算。", "label_en": "Two skills from reproducing calculations", "reason_en": "The text says “By reproducing calculations with existing code, I learned…”; the gains come directly from the computation."}, {"id": "p3-i2", "from": "p3-computation", "to": "p3-seminars", "type": "parallel", "status": "editorial", "label": "两条并列的 Berkeley 收获", "reason": "seminar 一句另起话题，没有写成计算的结果；按并列支线处理。", "label_en": "Two parallel gains", "reason_en": "The seminar sentence starts a new topic and is not written as a result of the computation, so the two are parallel strands."}]}, {"id": "p4", "title": "侯组的生物物理实践", "role": "使用并考察已有模型", "category": "experience", "gist": "用已有代码考察反应–相分离模型，获得模拟研究经验", "structure": "模型机制交代研究对象，行动说明本人实际参与，末块归纳能力收获。", "boundary": "不能凭代码内容推断本人观察到新规律或完成了数值稳定性验证。", "number": 4, "sourceText": "In Professor Zhonghuai Hou’s group, I worked with a Cahn–Hilliard model of phase separation that includes reactions between RNA and proteins. In the model, two types of RNA–protein complexes can form droplets and compete for the same supply of free protein. The model tracks the local concentrations of these complexes as molecules bind, dissociate, and diffuse. Using existing MATLAB code, I varied model parameters and examined how the droplet patterns changed over time. I examined the assumptions behind this continuum description and the numerical scheme used to evolve the concentration fields, and discussed both in group meetings. I learned to use a continuum model to connect molecular interactions with patterns at the scale of a droplet, and gained firsthand experience with simulation-based research.", "sourceChinese": "在侯中怀教授的课题组，我使用了一个描述相分离的 Cahn–Hilliard 模型，其中包含 RNA 和蛋白质之间的反应。在模型中，两类 RNA–蛋白质复合物都能形成液滴，并竞争同一批游离蛋白。模型追踪这些复合物的局部浓度随分子的结合、解离和扩散怎样变化。我用已有的 MATLAB 代码改变模型参数，考察液滴图案怎样随时间演化。我考察了这一连续场描述所用的假设，以及求解浓度场演化的数值计算方案，并在组会上讨论了这两方面。我学会用连续场模型把分子相互作用和液滴尺度的图案联系起来，也亲身体验了以模拟为主的研究。", "blocks": [{"id": "p4-model", "title": "模型：反应与相分离", "kind": "object", "status": "研究对象", "summary": "含 RNA–蛋白反应的 Cahn–Hilliard 相分离模型：两类复合物形成液滴并竞争同一批游离蛋白，模型追踪局部浓度随结合、解离与扩散的变化。", "sourceStart": 0, "sourceEnd": 362, "sourceText": "In Professor Zhonghuai Hou’s group, I worked with a Cahn–Hilliard model of phase separation that includes reactions between RNA and proteins. In the model, two types of RNA–protein complexes can form droplets and compete for the same supply of free protein. The model tracks the local concentrations of these complexes as molecules bind, dissociate, and diffuse.", "cell": {"r": 0, "c": 0, "cs": 1, "rs": 1}, "title_en": "The model: reactions and phase separation", "status_en": "Object of study", "summary_en": "A Cahn–Hilliard phase-separation model with RNA–protein reactions: two kinds of complexes form droplets and compete for the same free protein, and the model tracks local concentrations through binding, dissociation and diffusion."}, {"id": "p4-actions", "title": "模拟、考察与讨论", "kind": "experience", "status": "实际参与；措辞依据 CV", "summary": "用已有 MATLAB 代码改变参数，观察液滴图案随时间的变化；考察连续描述的假设与浓度场的数值方案，并在组会上讨论。", "sourceStart": 363, "sourceEnd": 638, "sourceText": "Using existing MATLAB code, I varied model parameters and examined how the droplet patterns changed over time. I examined the assumptions behind this continuum description and the numerical scheme used to evolve the concentration fields, and discussed both in group meetings.", "cell": {"r": 0, "c": 1, "cs": 1, "rs": 1}, "title_en": "Simulating, examining, discussing", "status_en": "Actual involvement; wording follows the CV", "summary_en": "Varied parameters in existing MATLAB code and watched the droplet patterns evolve; examined the assumptions of the continuum description and the numerical scheme, and discussed both in group meetings."}, {"id": "p4-gains", "title": "跨尺度描述与模拟训练", "kind": "gain", "status": "本人认可的收获", "summary": "学会用连续场模型连接分子相互作用与液滴尺度的图案，亲身体验以模拟为主的研究。", "sourceStart": 639, "sourceEnd": 812, "sourceText": "I learned to use a continuum model to connect molecular interactions with patterns at the scale of a droplet, and gained firsthand experience with simulation-based research.", "cell": {"r": 1, "c": 0, "cs": 2, "rs": 1}, "title_en": "Cross-scale description and simulation experience", "status_en": "Gains the author recognizes", "summary_en": "Learned to use a continuum model to link molecular interactions with droplet-scale patterns, and gained firsthand experience of simulation-based research."}], "title_en": "Biophysics practice in Hou's group", "role_en": "Using and examining an existing model", "gist_en": "Examining a phase-separation model with existing code", "structure_en": "The model and its mechanism set out the object of study; the actions describe the author's actual involvement; the last block sums up what was learned.", "boundary_en": "Nothing about the code should be read as the author having found a new pattern or having verified numerical stability.", "groups": [], "internalEdges": [{"id": "p4-i1", "from": "p4-model", "to": "p4-actions", "type": "action", "status": "text", "label": "在这一模型上开展工作", "reason": "“Using existing MATLAB code, I varied model parameters…” 的对象就是上一句的模型。", "label_en": "Working on this model", "reason_en": "“Using existing MATLAB code, I varied model parameters…” acts on the model just described."}, {"id": "p4-i2", "from": "p4-actions", "to": "p4-gains", "type": "result", "status": "text", "label": "形成能力收获", "reason": "末句 “I learned… and gained firsthand experience” 总结上述工作。", "label_en": "Leading to skills gained", "reason_en": "The last sentence, “I learned… and gained firsthand experience”, sums up the work."}]}, {"id": "p5", "title": "神经理论的吸引力", "role": "研究口味与具体追问", "category": "theory", "gist": "解析推导的清晰感与脑功能现象，两种并列的吸引力", "structure": "形式理论的吸引力由能量函数的例子具体呈现；脑功能现象是并列的另一种吸引力，两者不是因果。", "boundary": "形式清晰与脑功能吸引力是并列理由，不写成“因为……所以……”。", "number": 5, "sourceText": "I have long been drawn to the elegance of mathematical formalism in physics. After working mainly with simulations in Professor Hou’s group, I came to appreciate how analytical work in computational neuroscience could be just as important as simulation or experiment. I particularly liked the clarity of the derivations. In the attractor network I learned about in class, symmetric connections let us construct a scalar energy function to analyze how the network evolves. That made me ask how the analysis might change if the connections were asymmetric. The phenomena that computational neuroscience seeks to explain also interested me. I was surprised that physical theories could help us study learning, memory, attention, and language.", "sourceChinese": "我很早就被物理中数学形式体系的简洁之美吸引。在侯老师组里主要进行模拟研究之后，我逐渐体会到，计算神经科学中，对模型做解析推导可以和做模拟或实验同样重要。我尤其喜欢这些推导的清晰感。在课上学到的吸引子网络里，对称的连接让我们能够构造一个标量能量函数，用它分析网络如何演化。这也让我想知道，如果连接不对称，分析方法会怎样改变。计算神经科学试图解释的现象同样让我感兴趣。令我惊讶的是，物理理论也能帮助我们研究学习、记忆、注意力和语言。", "blocks": [{"id": "p5-formalism", "title": "解析工作的吸引力", "kind": "interest", "status": "本人真实反思", "summary": "一直被物理中数学形式之美吸引；在侯组主要做模拟之后，体会到解析工作同样重要，尤其喜欢推导的清晰。", "sourceStart": 0, "sourceEnd": 320, "sourceText": "I have long been drawn to the elegance of mathematical formalism in physics. After working mainly with simulations in Professor Hou’s group, I came to appreciate how analytical work in computational neuroscience could be just as important as simulation or experiment. I particularly liked the clarity of the derivations.", "cell": {"r": 0, "c": 0, "cs": 1, "rs": 1}, "title_en": "The appeal of analytical work", "status_en": "The author's own reflection", "summary_en": "Long drawn to the elegance of mathematical formalism; after mainly simulating in Hou's group, came to see analytical work as just as important, and liked the clarity of the derivations."}, {"id": "p5-energy", "title": "能量函数与非对称追问", "kind": "question", "status": "课堂学习与追问", "summary": "课上的吸引子网络：对称连接允许构造标量能量函数分析演化；由此追问连接不对称时分析会怎样改变。", "sourceStart": 321, "sourceEnd": 554, "sourceText": "In the attractor network I learned about in class, symmetric connections let us construct a scalar energy function to analyze how the network evolves. That made me ask how the analysis might change if the connections were asymmetric.", "cell": {"r": 0, "c": 1, "cs": 1, "rs": 1}, "title_en": "Energy functions and the asymmetric case", "status_en": "Coursework and a follow-up question", "summary_en": "In the attractor network from class, symmetric connections allow a scalar energy function for analyzing the dynamics; this raised the question of how the analysis changes when connections are asymmetric."}, {"id": "p5-phenomena", "title": "脑功能的吸引力", "kind": "interest", "status": "并列兴趣", "summary": "计算神经科学要解释的现象同样吸引我：物理理论竟能帮助研究学习、记忆、注意力与语言。", "sourceStart": 555, "sourceEnd": 739, "sourceText": "The phenomena that computational neuroscience seeks to explain also interested me. I was surprised that physical theories could help us study learning, memory, attention, and language.", "cell": {"r": 1, "c": 0, "cs": 2, "rs": 1}, "title_en": "The appeal of brain function", "status_en": "Parallel interest", "summary_en": "The phenomena computational neuroscience explains are interesting in themselves: physical theory can help study learning, memory, attention and language."}], "title_en": "The appeal of neural theory", "role_en": "Research taste and a concrete question", "gist_en": "Clear derivations and brain phenomena: two parallel attractions", "structure_en": "The appeal of formal theory is made concrete by the energy-function example; the phenomena of brain function are a second, parallel attraction. The two are not cause and effect.", "boundary_en": "Formal clarity and the appeal of brain function are parallel reasons; they must not be written as “because … therefore …”.", "groups": [{"id": "p5-g1", "title": "吸引力一 · 形式理论", "blocks": ["p5-formalism", "p5-energy"], "form": "plate", "title_en": "First attraction: formal theory"}, {"id": "p5-g2", "title": "吸引力二 · 研究对象", "blocks": ["p5-phenomena"], "form": "plate", "title_en": "Second attraction: the phenomena"}], "internalEdges": [{"id": "p5-i1", "from": "p5-formalism", "to": "p5-energy", "type": "example", "status": "editorial", "label": "具体例子：能量构造与追问", "reason": "能量函数是“推导清晰”的一个具体场景；原文未写“例如”，按例证理解。", "label_en": "A concrete case", "reason_en": "The energy function is one concrete setting for the “clarity of the derivations”; the text has no “for example”, so this is read as an illustration."}, {"id": "p5-i2", "from": "p5-formalism", "to": "p5-phenomena", "type": "parallel", "status": "text", "label": "两种并列的吸引力", "reason": "原文 “The phenomena… also interested me”，“also” 表明并列。", "label_en": "Two parallel attractions", "reason_en": "The text says “The phenomena… also interested me”; “also” marks a parallel reason."}]}, {"id": "p6", "title": "当前研究：谱与任务", "role": "已学工作与整合愿望", "category": "theory", "gist": "协方差谱与有限取样的学习，转向任务信息的三角框架", "structure": "前半是已开展的协方差谱与有限取样学习、跟推；后半转向任务信息，并在师兄指导下看到三个相互联系的问题。两类“有限”不是同一问题。", "boundary": "后半的三角框架是指导下的问题与整合愿望，不是已完成的独立理论成果，也不是取样修正的数学推论。", "number": 6, "sourceText": "My current undergraduate research project asks how to describe the collective activity of a recurrent neural network and what that description can tell us about learning and cognition. Professor Quan Wen and a senior member of his group introduced me to the covariance spectrum. It summarizes how the variance of population activity is distributed across its principal directions. To compare a model with recordings, I first needed to understand how finite sampling affects the estimated spectrum. I studied how Hu and Sompolinsky relate sampled and population spectra using free probability. The mathematics textbooks I referred to covered more than I needed for the calculation, so I used AI tools to study the relevant concepts and then followed the paper’s derivation to the end. This helped me see how the relation between the spectra depends on the sampling scheme and model assumptions. Beyond estimating the spectrum, I wanted to understand its relation to task performance. Knowing how much activity varies along each principal direction does not tell us whether it carries the information a task requires. Discussions with the senior group member helped me see three questions that fit together. Given the demands of a task, which information should the network devote more of its limited resources to representing? Can the network’s connections produce such a representation? If a downstream system can read out only part of the activity, can it still use that representation to perform the task? I want to bring task demands, network representation, and limited readout into one theoretical model and study how they work together to shape task performance.", "sourceChinese": "我目前的本科科研项目研究怎样描述递归神经网络的集体活动，以及这种描述能帮助我们理解学习与认知的哪些方面。温老师和课题组的一位师兄带我从协方差谱入手。它概括了群体活动的方差在各主方向上怎样分布。为了比较模型和记录，我先需要弄清，有限取样会怎样影响估计得到的谱。我学习了 Hu 和 Sompolinsky 如何用自由概率联系取样谱与总体谱。我查阅的数学教材涵盖了超出这项计算所需的内容，因此我借助 AI 学习相关概念，随后跟着论文推完了相关推导。这让我看见，两个谱的关系怎样依赖取样方式和模型假设。除了估计谱，我也想理解它与任务表现的关系。知道活动沿各主方向的变异大小，并不能告诉我们这些活动是否承载了任务所需的信息。与师兄讨论后，我看到三个相互联系的问题。根据任务需求，网络应该把更多有限资源用于表征哪些信息？网络的连接能否产生这样的表征？如果下游系统只能读取部分活动，它还能利用这种表征完成任务吗？我想把任务需求、网络表征和有限读取放进一个理论模型，研究它们怎样共同影响任务表现。", "blocks": [{"id": "p6-project", "title": "项目与协方差谱", "kind": "experience", "status": "当前项目", "summary": "本科项目问：怎样描述递归网络的集体活动，这种描述能告诉我们学习与认知的什么；温老师与师兄引导我从协方差谱入手。", "sourceStart": 0, "sourceEnd": 380, "sourceText": "My current undergraduate research project asks how to describe the collective activity of a recurrent neural network and what that description can tell us about learning and cognition. Professor Quan Wen and a senior member of his group introduced me to the covariance spectrum. It summarizes how the variance of population activity is distributed across its principal directions.", "cell": {"r": 0, "c": 0, "cs": 1, "rs": 1}, "title_en": "The project and the covariance spectrum", "status_en": "Current project", "summary_en": "The undergraduate project asks how to describe the collective activity of a recurrent network and what that tells us about learning and cognition; Professor Wen and a senior group member pointed to the covariance spectrum."}, {"id": "p6-sampling", "title": "有限取样：学习与跟推", "kind": "learn", "status": "已开展的学习", "summary": "为比较模型与记录，先弄清有限取样怎样影响估计谱：学习 Hu–Sompolinsky 用自由概率联系取样谱与总体谱，借 AI 学概念后跟推完推导，看到谱关系依赖取样方式与模型假设。", "sourceStart": 381, "sourceEnd": 893, "sourceText": "To compare a model with recordings, I first needed to understand how finite sampling affects the estimated spectrum. I studied how Hu and Sompolinsky relate sampled and population spectra using free probability. The mathematics textbooks I referred to covered more than I needed for the calculation, so I used AI tools to study the relevant concepts and then followed the paper’s derivation to the end. This helped me see how the relation between the spectra depends on the sampling scheme and model assumptions.", "cell": {"r": 0, "c": 1, "cs": 1, "rs": 1}, "title_en": "Finite sampling: study and derivation", "status_en": "Study carried out", "summary_en": "To compare models with recordings, first understand how finite sampling affects the estimated spectrum: studied how Hu and Sompolinsky relate sampled and population spectra through free probability, learned the concepts with AI help, followed the derivation to the end, and saw how the relation depends on the sampling scheme and model assumptions."}, {"id": "p6-function", "title": "从描述转向任务信息", "kind": "question", "status": "本人认可的区分", "summary": "除了估计谱，还想理解它与任务表现的关系：方差沿各方向有多大，并不说明活动是否承载任务所需的信息。", "sourceStart": 894, "sourceEnd": 1115, "sourceText": "Beyond estimating the spectrum, I wanted to understand its relation to task performance. Knowing how much activity varies along each principal direction does not tell us whether it carries the information a task requires.", "cell": {"r": 1, "c": 1, "cs": 1, "rs": 1}, "title_en": "From description to task information", "status_en": "A distinction the author endorses", "summary_en": "Beyond estimating the spectrum: how much activity varies along each direction does not tell us whether it carries the information a task needs."}, {"id": "p6-triangle", "title": "三角框架与整合愿望", "kind": "plan", "status": "师兄指导下的问题与计划", "summary": "与师兄讨论后看到三个相互联系的问题——任务需求、网络表征、有限读取；想把三者放进一个理论模型，研究它们怎样共同影响任务表现。", "sourceStart": 1116, "sourceEnd": 1668, "sourceText": "Discussions with the senior group member helped me see three questions that fit together. Given the demands of a task, which information should the network devote more of its limited resources to representing? Can the network’s connections produce such a representation? If a downstream system can read out only part of the activity, can it still use that representation to perform the task? I want to bring task demands, network representation, and limited readout into one theoretical model and study how they work together to shape task performance.", "cell": {"r": 1, "c": 0, "cs": 1, "rs": 1}, "title_en": "A three-part framework and an integrative aim", "status_en": "Questions and plans under guidance", "summary_en": "Discussions with a senior group member brought out three linked questions — task demands, network representation, limited readout — and the aim of studying them together in one theoretical model."}], "title_en": "Current research: spectra and tasks", "role_en": "Work studied so far and an integrative aim", "gist_en": "From covariance spectra and sampling to task information", "structure_en": "The first half is the study of covariance spectra and finite sampling, including following a derivation to the end; the second half turns to task information and, with guidance from a senior group member, to three connected questions. The two kinds of “limited” are different problems.", "boundary_en": "The three-part framework in the second half is a set of guided questions and an integrative aim. It is not a completed independent theoretical result, and it is not a mathematical consequence of the sampling correction.", "groups": [{"id": "p6-g1", "title": "已开展：描述与取样", "blocks": ["p6-project", "p6-sampling"], "form": "plate", "title_en": "Done so far: description and sampling"}, {"id": "p6-g2", "title": "转向：功能问题与想做的框架", "blocks": ["p6-function", "p6-triangle"], "form": "plate", "title_en": "The turn: function and the intended framework"}], "internalEdges": [{"id": "p6-i1", "from": "p6-project", "to": "p6-sampling", "type": "task", "status": "text", "label": "比较模型与记录，先要处理取样", "reason": "“To compare a model with recordings, I first needed to understand how finite sampling affects the estimated spectrum.”", "label_en": "Comparing with recordings needs sampling first", "reason_en": "“To compare a model with recordings, I first needed to understand how finite sampling affects the estimated spectrum.”"}, {"id": "p6-i2", "from": "p6-sampling", "to": "p6-function", "type": "transition", "status": "text", "label": "转向：“Beyond estimating the spectrum”", "reason": "原文以 “Beyond estimating the spectrum” 转到互补的功能问题。", "label_en": "The turn: “Beyond estimating the spectrum”", "reason_en": "The text turns with “Beyond estimating the spectrum” to a complementary question about function."}, {"id": "p6-i3", "from": "p6-function", "to": "p6-triangle", "type": "elaboration", "status": "text", "label": "展开为三个相互联系的问题", "reason": "三角框架回答“谱之外，什么决定任务表现”。", "label_en": "Unfolds into three linked questions", "reason_en": "The framework addresses what, beyond the spectrum, shapes task performance."}, {"id": "p6-i4", "from": "p6-sampling", "to": "p6-triangle", "type": "distinction", "status": "editorial", "label": "有限取样 ≠ 有限读取", "reason": "两处都有“有限”：前者是记录只取到部分神经元对估计谱的影响，后者是下游只读到部分活动能否完成任务。两类限制不同，不能把后者当作前者的推论。", "label_en": "Finite sampling ≠ limited readout", "reason_en": "Both involve a limit. One is recordings that cover only some neurons, which affects the estimated spectrum; the other is a downstream system that reads only part of the activity. They are different constraints, and the second is not a consequence of the first."}]}, {"id": "p7", "title": "研究方式与更广兴趣", "role": "未来研究与训练期待", "category": "future", "gist": "比较模型与 AI 时代的物理图像；记忆、泛化与语言", "structure": "模型比较与 AI 思考属于研究方式；学习记忆、语言属于更广问题，两者保持探索中的联系；末句收束为对 PhD 训练的期待。", "boundary": "AI 兴趣由获知 Lyapunov 谱突破触发，不能写成“因为用 AI 学过推导，所以产生 AI4Math 兴趣”，因此 P6 的 AI 学习与本段不连线。“formal proofs”“reformulating…”按 v26 原文展示，专业措辞审读另行提出。记忆、泛化与语言是探索中的较广兴趣，无需由毕设推出。", "number": 7, "sourceText": "Putting these pieces together would give me a starting point for the kind of work I most enjoy: studying the same phenomenon with different models to see which explanations hold across models and which depend on particular assumptions. News of the AI-assisted breakthrough on random RNN Lyapunov spectra suggested new possibilities for theoretical research. If AI makes it easier to work through formal proofs, we could explore a wider range of models and assumptions in a continuous workflow. In my view, researchers should then focus on reformulating analytical or numerical results in terms of clear physical pictures and a coherent story. More broadly, I want to understand how the brain learns efficiently. How does experience strengthen memory, and how does learning generalize to new situations? Beyond learning and memory, I want to understand the neural basis of language. How does language emerge from neural activity, and what role does it play in thought? Through PhD training, I hope to learn how to formulate interesting questions about language and cognition, then develop the methods to answer them.", "sourceChinese": "把这三部分连起来，可以成为我最喜欢的一种研究方式的起点：用不同的模型研究同一个现象，判断哪些解释在不同模型中都成立，哪些只依赖特定的假设。AI 协助取得随机 RNN Lyapunov 谱突破的消息，让我看到了理论研究的新可能。如果 AI 能让形式证明更容易推进，我们就可能在连贯的研究过程中探索更多模型与假设。在我看来，研究者应进一步着重于重新组织解析或数值结果的表述，以清楚的物理图像和连贯的物理故事呈现它们。在更广的层面上，我想理解大脑怎样高效学习。经验如何巩固记忆，学习又如何泛化到新的情境？除了学习与记忆，我也想理解语言的神经基础。语言如何从神经活动中涌现，又在思维中起到什么作用？我希望通过博士训练，学会提出关于语言与认知的有趣问题，进而发展回答这些问题的方法。", "blocks": [{"id": "p7-comparison", "title": "比较模型的研究方式", "kind": "interest", "status": "研究取向", "summary": "把前面几部分合起来，是我最喜欢的研究方式的起点：用不同模型研究同一现象，看哪些解释跨模型成立、哪些依赖特定假设。", "sourceStart": 0, "sourceEnd": 235, "sourceText": "Putting these pieces together would give me a starting point for the kind of work I most enjoy: studying the same phenomenon with different models to see which explanations hold across models and which depend on particular assumptions.", "cell": {"r": 0, "c": 0, "cs": 1, "rs": 1}, "title_en": "Comparing models", "status_en": "Research orientation", "summary_en": "Putting the pieces together leads to the favorite kind of work: studying one phenomenon with different models to see which explanations hold across models and which depend on particular assumptions."}, {"id": "p7-ai", "title": "AI 与物理图像", "kind": "interest", "status": "本人已补充的思考", "summary": "AI 协助的随机 RNN Lyapunov 谱突破提示新可能：若 AI 让形式证明更易推进，可在连贯流程中探索更多模型与假设；研究者应着重以清楚的物理图像和连贯的故事重新组织结果。", "sourceStart": 236, "sourceEnd": 642, "sourceText": "News of the AI-assisted breakthrough on random RNN Lyapunov spectra suggested new possibilities for theoretical research. If AI makes it easier to work through formal proofs, we could explore a wider range of models and assumptions in a continuous workflow. In my view, researchers should then focus on reformulating analytical or numerical results in terms of clear physical pictures and a coherent story.", "cell": {"r": 0, "c": 1, "cs": 1, "rs": 1}, "title_en": "AI and physical pictures", "status_en": "The author's added thought", "summary_en": "News of the AI-assisted result on random RNN Lyapunov spectra suggests that, if AI eases formal proofs, a wider range of models and assumptions can be explored; researchers should then focus on recasting results as clear physical pictures and a coherent story."}, {"id": "p7-learning", "title": "高效学习、记忆与泛化", "kind": "question", "status": "探索中的较广兴趣", "summary": "更广地，想理解大脑怎样高效学习：经验怎样巩固记忆，学习又怎样泛化到新情境？", "sourceStart": 643, "sourceEnd": 802, "sourceText": "More broadly, I want to understand how the brain learns efficiently. How does experience strengthen memory, and how does learning generalize to new situations?", "cell": {"r": 1, "c": 0, "cs": 1, "rs": 1}, "title_en": "Efficient learning, memory and generalization", "status_en": "Broader interest, still exploring", "summary_en": "More broadly: how does the brain learn efficiently, how does experience strengthen memory, and how does learning generalize to new situations?"}, {"id": "p7-language", "title": "语言的神经基础", "kind": "question", "status": "探索中的兴趣", "summary": "也想理解语言的神经基础：语言怎样从神经活动中涌现，又在思维中起什么作用？", "sourceStart": 803, "sourceEnd": 967, "sourceText": "Beyond learning and memory, I want to understand the neural basis of language. How does language emerge from neural activity, and what role does it play in thought?", "cell": {"r": 1, "c": 1, "cs": 1, "rs": 1}, "title_en": "The neural basis of language", "status_en": "Interest, still exploring", "summary_en": "How does language emerge from neural activity, and what role does it play in thought?"}, {"id": "p7-training", "title": "对 PhD 训练的期待", "kind": "plan", "status": "训练愿望", "summary": "希望通过 PhD 训练，学会提出关于语言与认知的有趣问题，并发展回答它们的方法。", "sourceStart": 968, "sourceEnd": 1115, "sourceText": "Through PhD training, I hope to learn how to formulate interesting questions about language and cognition, then develop the methods to answer them.", "cell": {"r": 2, "c": 0, "cs": 2, "rs": 1}, "title_en": "Hopes for PhD training", "status_en": "Training aim", "summary_en": "To learn, through PhD training, how to pose interesting questions about language and cognition and how to develop methods to answer them."}], "title_en": "Ways of doing research and broader interests", "role_en": "Future research and hopes for training", "gist_en": "Comparing models, physical pictures, memory and language", "structure_en": "Comparing models and the thoughts on AI concern how to do research; learning, memory and language are broader questions, linked to the first group in an exploratory way; the last sentence turns to hopes for PhD training.", "boundary_en": "The interest in AI was triggered by news of the Lyapunov-spectrum breakthrough. It must not be written as “having used AI to learn a derivation led to an interest in AI for mathematics”, so the AI-assisted learning in P6 is not linked to this paragraph. “formal proofs” and “reformulating …” are shown exactly as in v26; any review of that technical wording is a separate matter. Memory, generalization and language are broader interests still being explored and need not follow from the thesis.", "groups": [{"id": "p7-g1", "title": "怎样研究", "blocks": ["p7-comparison", "p7-ai"], "form": "plate", "title_en": "How to do research"}, {"id": "p7-g2", "title": "更广的问题 · 并列", "blocks": ["p7-learning", "p7-language"], "form": "parallel", "title_en": "Broader questions, side by side"}], "internalEdges": [{"id": "p7-i1", "from": "p7-ai", "to": "p7-comparison", "type": "method", "status": "text", "label": "AI 或可扩大可比较的模型与假设", "reason": "“we could explore a wider range of models and assumptions” 与上一句“different models… particular assumptions”用词对应。", "label_en": "AI may widen what can be compared", "reason_en": "“we could explore a wider range of models and assumptions” echoes “different models… particular assumptions” in the previous sentence."}, {"id": "p7-i2", "from": "p7-comparison", "to": "p7-learning", "type": "scope", "status": "text", "label": "“More broadly”：从研究方式转到更广问题", "reason": "原文以 “More broadly” 换到问题层面，不是方法的推论。", "label_en": "“More broadly”: from method to wider questions", "reason_en": "The text moves with “More broadly” to the level of questions; this is not a consequence of the method."}, {"id": "p7-i3", "from": "p7-learning", "to": "p7-language", "type": "parallel", "status": "text", "label": "“Beyond learning and memory”：并列的另一类问题", "reason": "“Beyond learning and memory” 表示并列追加。", "label_en": "“Beyond learning and memory”", "reason_en": "“Beyond learning and memory” adds a parallel question."}, {"id": "p7-i4", "from": "p7-language", "to": "p7-training", "type": "purpose", "status": "text", "label": "问题指向训练期待", "reason": "末句 “questions about language and cognition” 承接语言问题，转为对训练的期待。", "label_en": "The questions point to hopes for training", "reason_en": "The last sentence, “questions about language and cognition”, picks up the language question and turns it into a hope for training."}]}, {"id": "p8", "title": "项目与导师匹配", "role": "待定制模板", "category": "future", "gist": "学校、项目与导师匹配（模板，待逐校填写）", "structure": "具体问题与项目资源相接，再以导师研究和训练机会展开。所有方括号内容仍待核实填写。", "boundary": "仍是模板：学校、教授与机会尚未填写，不能把占位内容当作已确定的匹配。", "number": 8, "sourceText": "At [University], the [PhD program] would let me pursue [specific research question from this statement] through [specific program resource or research opportunity]. I am interested in Professor [Name]’s work on [specific result, method, or system], which could help me investigate [concrete question that follows from that work]. Professor [Name]’s research on [second topic] offers a complementary way to study [related question]. [If applicable: connect the two interests through one verified training or collaboration opportunity.]", "sourceChinese": "在[学校]，[博士项目]的[具体资源或研究机会]能帮助我继续研究[与前文相接的具体问题]。[姓名]教授关于[具体结果、方法或研究对象]的工作让我感兴趣，因为它可以帮助我研究[由这项工作引出的具体问题]。[姓名]教授对[另一研究主题]的研究，则为理解[相关问题]提供了另一种途径。[如果适用，用一项已核实的训练或合作机会把两处兴趣连起来。]", "blocks": [{"id": "p8-program", "title": "问题与项目资源", "kind": "template", "status": "待定制", "summary": "模板：在[学校]的[博士项目]，借[具体资源或研究机会]研究[与前文相接的具体问题]。", "sourceStart": 0, "sourceEnd": 164, "sourceText": "At [University], the [PhD program] would let me pursue [specific research question from this statement] through [specific program resource or research opportunity].", "cell": {"r": 0, "c": 0, "cs": 1, "rs": 1}, "title_en": "Question and program resources", "status_en": "To be tailored", "summary_en": "Template: at [University], the [PhD program] would support [a question from this statement] through [a specific resource or opportunity]."}, {"id": "p8-faculty", "title": "导师与训练机会", "kind": "template", "status": "待定制", "summary": "模板：[教授]关于[具体工作]的研究可帮助我追问[具体问题]；另一位教授提供互补视角；如适用，以一项已核实的训练或合作机会连接两者。", "sourceStart": 165, "sourceEnd": 534, "sourceText": "I am interested in Professor [Name]’s work on [specific result, method, or system], which could help me investigate [concrete question that follows from that work]. Professor [Name]’s research on [second topic] offers a complementary way to study [related question]. [If applicable: connect the two interests through one verified training or collaboration opportunity.]", "cell": {"r": 0, "c": 1, "cs": 1, "rs": 1}, "title_en": "Faculty and training opportunities", "status_en": "To be tailored", "summary_en": "Template: Professor [Name]'s work on [a topic] could help investigate [a question]; a second professor offers a complementary angle; if applicable, one verified training or collaboration opportunity links the two."}], "title_en": "Program and faculty fit", "role_en": "Template to be tailored", "gist_en": "Program and faculty fit — a template still to be filled in", "structure_en": "A specific question is matched to program resources, then developed through faculty research and training opportunities. Everything in brackets is still to be verified and filled in.", "boundary_en": "This is still a template: the school, faculty and opportunities are not filled in, and the placeholders must not be read as a settled match.", "groups": [], "internalEdges": [{"id": "p8-i1", "from": "p8-program", "to": "p8-faculty", "type": "elaboration", "status": "template", "label": "以具体导师研究展开匹配", "reason": "模板结构：先资源，后导师。", "label_en": "Developed through faculty research", "reason_en": "Template structure: resources first, then faculty."}]}], "crossEdges": [{"id": "x1", "from": "p1-goal", "to": "p2-question", "type": "elaboration", "status": "text", "label": "总问题收窄为具体问题", "reason": "P1 问集体活动怎样产生学习与认知；P2 把它具体化为“连接 → 集体活动 → 表征与行为”，两处都写 collective activity。", "caution": "", "review": "复核新增", "label_en": "The central question, narrowed", "reason_en": "P1 asks how collective activity gives rise to learning and cognition; P2 makes this specific as connectivity → collective activity → representation and behavior. Both use “collective activity”.", "caution_en": "", "review_en": "Added in this review"}, {"id": "x2", "from": "p1-physics", "to": "p2-math", "type": "support", "status": "text", "label": "物理训练的具体内容", "reason": "P1 说理论物理带来的思路；P2 以 “Several courses from my physics training” 展开训练内容。", "caution": "", "review": "保留（原 e1）", "label_en": "What the physics training contained", "reason_en": "P1 speaks of the approach physics taught; P2 opens with “Several courses from my physics training”.", "caution_en": "", "review_en": "Kept (formerly e1)"}, {"id": "x3", "from": "p1-goal", "to": "p6-project", "type": "echo", "status": "text", "label": "同一总问题落到当前项目", "reason": "P6 项目问“怎样描述递归网络的集体活动……能告诉我们学习与认知的什么”，与 P1 开篇几乎同词。", "caution": "", "review": "复核新增", "label_en": "The same question in the current project", "reason_en": "The P6 project asks how to describe the collective activity of a recurrent network and what that tells us about learning and cognition — almost the wording of P1's opening.", "caution_en": "", "review_en": "Added in this review"}, {"id": "x4", "from": "p1-phd", "to": "p7-training", "type": "echo", "status": "text", "label": "PhD 目标首尾呼应", "reason": "P1 末句与 P7 末句都写 PhD：前者是申请目标，后者是对训练本身的期待。", "caution": "", "review": "复核新增（由 P1、P7 末句拆块而来）", "label_en": "The PhD goal at both ends", "reason_en": "The last sentences of P1 and P7 both mention the PhD: first as the goal of the application, then as hopes for the training itself.", "caution_en": "", "review_en": "Added in this review, after the last sentences of P1 and P7 became blocks of their own"}, {"id": "x5", "from": "p2-ensemble", "to": "p5-energy", "type": "echo", "status": "editorial", "label": "统计物理思想与能量函数", "reason": "能量函数分析属统计物理传统，与系综思想主题相近；原文没有直接把两者相连。", "caution": "只是编辑性呼应，不代表作者在文中这样论证。", "review": "保留（原 e2）", "label_en": "Statistical-physics thinking and energy functions", "reason_en": "Energy-function analysis belongs to the statistical-physics tradition and is thematically close to ensemble thinking; the text does not connect the two directly.", "caution_en": "An editorial echo only; it does not mean the essay argues this.", "review_en": "Kept (formerly e2)"}, {"id": "x6", "from": "p2-math", "to": "p6-sampling", "type": "support", "status": "editorial", "label": "数学工具用于当前学习", "reason": "P6 借教材与自由概率理解取样谱，与 P2 的线性代数、概率统计属同一类准备；原文没有直接点名。", "caution": "", "review": "保留，状态由“现稿联系”改为“编辑性”", "label_en": "Mathematical tools in the current study", "reason_en": "P6 relies on textbooks and free probability to understand sampled spectra, the same kind of preparation as the linear algebra, probability and statistics in P2; the text does not say so directly.", "caution_en": "", "review_en": "Kept; status changed from “link in the text” to “editorial”"}, {"id": "x7", "from": "p2-replica", "to": "p6-project", "type": "echo", "status": "text", "label": "同一对象：递归网络的协方差谱", "reason": "P2 末句写 replica 被用于计算结构化递归网络的 covariance spectrum；P6 项目正是从 covariance spectrum 入手。", "caution": "Wen 组的 replica 材料与 Hu–Sompolinsky 自由概率论文是两份材料。此线只表示研究对象相同，不表示 P6 用了 replica 方法。replica 材料的来源已在项目中核对。", "review": "复核新增", "label_en": "Same object: covariance spectra of recurrent networks", "reason_en": "P2's last sentence says the replica trick was used to compute the covariance spectrum of a structured recurrent network; the P6 project starts from the covariance spectrum.", "caution_en": "The replica material from Wen's group and the Hu–Sompolinsky free-probability paper are two different sources. This link only marks the same object of study; it does not mean P6 used the replica method. The source of the replica material has been checked within the project.", "review_en": "Added in this review"}, {"id": "x8", "from": "p2-question", "to": "p6-triangle", "type": "echo", "status": "text", "label": "连接–表征–任务问题再现", "reason": "P2 问连接怎样塑造活动、活动怎样支持表征与行为；P6 三角框架问连接能否产生所需表征、有限读取能否完成任务。用词直接对应。", "caution": "三角框架来自与师兄的讨论；此线只标出用词呼应，不表示 P2 的问题推出了 P6 的框架。", "review": "复核新增", "label_en": "Connections, representation and tasks, again", "reason_en": "P2 asks how connectivity shapes activity and how activity supports representation and behavior; the P6 framework asks whether connections can produce the needed representation and whether limited readout suffices for the task. The wording corresponds directly.", "caution_en": "The framework came from discussions with a senior group member; this link marks the echo in wording, not that P2's question produced P6's framework.", "review_en": "Added in this review"}, {"id": "x9", "from": "p3-seminars", "to": "p4-model", "type": "development", "status": "text", "label": "生物物理兴趣与随后的实践", "reason": "P3 末句 “That possibility drew me to biophysics”，P4 随即叙述侯组的生物物理模型工作。", "caution": "原文只是相邻承接，没有写 seminar 直接导致加入侯组。", "review": "保留（原 e4）", "label_en": "An interest in biophysics, then practice", "reason_en": "P3 ends with “That possibility drew me to biophysics”, and P4 turns straight to biophysical modeling in Hou's group.", "caution_en": "The text only places these side by side; it does not say the seminars led directly to joining Hou's group.", "review_en": "Kept (formerly e4)"}, {"id": "x10", "from": "p3-skills", "to": "p6-sampling", "type": "echo", "status": "editorial", "label": "借已有工作进入理论", "reason": "P3 借现有代码复现计算以理解抽象理论；P6 借教材与 AI 学概念后跟推论文推导。学习方式相近，原文未相互指涉。", "caution": "不是因果：不能写成 P3 的能力导致 P6 的学习。", "review": "保留（原 e12）", "label_en": "Entering theory through existing work", "reason_en": "In P3, reproducing calculations with existing code is a way into abstract theory; in P6, textbooks and AI help lead to following a paper's derivation. The ways of learning are similar, but neither passage refers to the other.", "caution_en": "Not causal: the skill in P3 must not be written as the cause of the study in P6.", "review_en": "Kept (formerly e12)"}, {"id": "x11", "from": "p4-gains", "to": "p5-formalism", "type": "contrast", "status": "text", "label": "模拟为主 ↔ 解析工作", "reason": "P4 末句 “simulation-based research”；P5 写 “After working mainly with simulations in Professor Hou’s group… analytical work… just as important”。", "caution": "", "review": "起点由 p4-actions 改为 p4-gains，“以模拟为主”在这一块", "label_en": "Simulation-based ↔ analytical work", "reason_en": "P4 ends with “simulation-based research”; P5 says “After working mainly with simulations in Professor Hou’s group… analytical work… just as important”.", "caution_en": "", "review_en": "Start moved from p4-actions to p4-gains, where “simulation-based” appears"}, {"id": "x12", "from": "p5-formalism", "to": "p7-ai", "type": "echo", "status": "endorsed", "label": "推导的清晰 ↔ 清楚的物理图像", "reason": "P5 “clarity of the derivations” 与 P7 “clear physical pictures and a coherent story” 是同一种趣味。本人认可这一联系。", "caution": "", "review": "起点由 p5-energy 改为 p5-formalism，“推导清晰”在这一块", "label_en": "Clear derivations ↔ clear physical pictures", "reason_en": "P5's “clarity of the derivations” and P7's “clear physical pictures and a coherent story” express the same taste. The author has endorsed this link.", "caution_en": "", "review_en": "Start moved from p5-energy to p5-formalism, where the clarity of derivations appears"}, {"id": "x13", "from": "p5-phenomena", "to": "p7-learning", "type": "elaboration", "status": "text", "label": "学习、记忆兴趣的展开", "reason": "P5 列 learning, memory；P7 追问高效学习、记忆巩固与泛化。", "caution": "P5 列出的 attention 没有在后文展开。", "review": "保留（原 e7）", "label_en": "Learning and memory, developed", "reason_en": "P5 lists learning and memory; P7 asks about efficient learning, memory consolidation and generalization.", "caution_en": "Attention, also listed in P5, is not developed later.", "review_en": "Kept (formerly e7)"}, {"id": "x14", "from": "p5-phenomena", "to": "p7-language", "type": "elaboration", "status": "text", "label": "语言兴趣的展开", "reason": "P5 列 language；P7 追问语言的神经基础与它在思维中的作用。", "caution": "", "review": "保留（原 e8）", "label_en": "Language, developed", "reason_en": "P5 lists language; P7 asks about the neural basis of language and its role in thought.", "caution_en": "", "review_en": "Kept (formerly e8)"}, {"id": "x15", "from": "p6-triangle", "to": "p7-comparison", "type": "development", "status": "text", "label": "“these pieces”合起来 → 比较模型", "reason": "P7 首句 “Putting these pieces together” 承接 P6 的三个问题与整合模型。", "caution": "理由仍较宽；不能补入“一次只改一个因素”等未确认的研究设计。", "review": "保留（原 e9）", "label_en": "“These pieces” together → comparing models", "reason_en": "P7 opens with “Putting these pieces together”, picking up P6's three questions and the integrated model.", "caution_en": "The rationale is still broad; unconfirmed research designs such as “changing one factor at a time” must not be added.", "review_en": "Kept (formerly e9)"}, {"id": "x16", "from": "p7-training", "to": "p8-program", "type": "purpose", "status": "template", "label": "训练期待 → 项目资源", "reason": "P8 模板要求选一个与前文相接的研究问题与项目资源；学校与导师未填，故为待定制。", "caution": "", "review": "起点由 p7-language 改为拆出的 p7-training", "label_en": "Hopes for training → program resources", "reason_en": "The P8 template asks for a research question and a program resource that follow from the statement; the school and faculty are not filled in, so this link is still to be tailored.", "caution_en": "", "review_en": "Start moved from p7-language to the new p7-training block"}], "notes": [{"id": "n1", "title": "理论与丰富现象", "status": "待阅读酝酿", "text": "比较不同模型，怎样回应理论与生命现象之间的关系？需要最近阅读论文继续酝酿，不能直接补成已经形成的学术理念。", "userWords": "这个有道理，我值得思考，但是目前我的摄入不够去表达清楚这个点，需要最近阅读论文等来酝酿（计划中）", "reading": "Ongoing-Breakthrough 中 Lyapunov 谱论文的物理解释、模型假设和讨论；AI4Math 阅读材料。", "targets": ["p1-theory", "p7-comparison", "p7-ai"], "addedTargets": ["p7-comparison"], "review": "批注以“比较不同模型”开头 work to a question of one's own? This is hard to resolve for now. The overall interest in task, representation and readout stays; no fixed next computational design has been settled.", "userWords_en": "This question isn't easy to resolve at the moment.", "reading_en": "The author's existing neural research questions, the thesis triangle, and further reading.", "review_en": "Targets kept."}, {"id": "n4", "title": "理论与记录、行为证据", "status": "待阅读酝酿", "text": "什么观测或行为证据能够帮助判断一种解释，或区分不同解释？本人认为这是后期酝酿中非常重要的问题。", "userWords": "后期酝酿中值得思考这个问题，非常重要的", "reading": "理论预测怎样与有限神经记录及任务表现相接。", "targets": ["p6-function", "p7-comparison", "p8-program"], "addedTargets": ["p7-comparison"], "review": "“区分不同解释”与 p7-comparison 的 “which explanations hold across models” 直接相关，故补上靶点。", "title_en": "Theory, recordings and behavioral evidence", "status_en": "To develop through reading", "text_en": "What observations or behavioral evidence could help judge one explanation, or tell different explanations apart? The author considers this a very important question for later reflection.", "userWords_en": "Worth thinking about later on — it's a very important question.", "reading_en": "How theoretical predictions connect with limited neural recordings and task performance.", "review_en": "“Telling different explanations apart” relates directly to p7-comparison's “which explanations hold across models”, so p7-comparison was added as a target."}], "pairLabels": {"p1|p2": "问题收窄 · 训练展开", "p1|p6": "同一总问题", "p1|p7": "PhD 首尾呼应", "p2|p5": "统计物理思想", "p2|p6": "谱、工具与问题的延续", "p3|p4": "生物物理兴趣 → 实践", "p3|p6": "复现与跟推", "p4|p5": "模拟 ↔ 解析", "p5|p7": "兴趣的展开", "p6|p7": "合起来 → 比较模型", "p7|p8": "训练 → 项目"}, "pairLabels_en": {"p1|p2": "Question narrowed, training unpacked", "p1|p6": "Same central question", "p1|p7": "The PhD at both ends", "p2|p5": "Statistical-physics thinking", "p2|p6": "Spectra, tools and questions carried on", "p3|p4": "Biophysics: interest → practice", "p3|p6": "Reproducing and following", "p4|p5": "Simulation ↔ analysis", "p5|p7": "Interests developed", "p6|p7": "Pieces together → comparison", "p7|p8": "Training → program"}, "notLinked": ["P6 的“借 AI 学概念”与 P7 的 AI 兴趣：本人明确兴趣由 Lyapunov 谱突破消息触发，不由 AI 学习经历推出。", "P3 英语沟通 → seminar，P3 计算 → 兴趣转向：两条支线并列，不画因果。", "P2 问题 → P2 replica：replica 是技术迁移的例子，不是该问题的答案。", "P1 理论与丰富现象 ↔ P7 AI：原“待酝酿”边已由批注 n1 表达，不再重复画线。"], "notLinked_en": ["P6's “used AI tools to study the relevant concepts” and P7's interest in AI: the author states that the interest was triggered by news of the Lyapunov-spectrum result, not by the experience of learning with AI.", "P3 English communication → seminars, and P3 computation → change of interest: the two strands are parallel, and no causation is drawn.", "P2 question → P2 replica trick: the replica trick is an example of a transferred technique, not an answer to the question.", "P1 theory and phenomena ↔ P7 AI: the former “still developing” link is now carried by note n1 rather than by a separate line."]}</script>
